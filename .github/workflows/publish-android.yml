name: Publish locally signed Android APK
on:
  push:
    branches: [android]
    paths: ['mobile/publish-apk/release.b64', 'mobile/publish-apk/release.json']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve tested build and reconstruct public signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(python -c "import json; print(int(json.load(open('mobile/publish-apk/release.json'))['source_run']))")
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run_id --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run_id --jq .head_branch)" = android
          source_commit=$(python -c "import json; print(json.load(open('mobile/publish-apk/release.json'))['source_commit'])")
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run_id --jq .head_sha)" = "$source_commit"
          gh run download "$run_id" --name PulseFour-Android --dir base
          mkdir -p release
          python mobile/publish-apk/signature_patch.py apply base/PulseFour-Android.apk mobile/publish-apk/release.b64 release/PulseFour-Android.apk
          java -jar base/apksigner.jar verify --verbose --print-certs release/PulseFour-Android.apk > release/signature.txt
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('mobile/publish-apk/release.json').read_text())
          assert meta['certificate_sha256'].lower() in Path('release/signature.txt').read_text().lower()
          PY
          cp base/PulseFour-Android.pck base/android-update.json release/
          gh release download android-standalone --pattern PulseFour-Android.apk --output release/previous.apk
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check signed APK installation and visible UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: |
            bash mobile/publish-apk/upgrade-smoke.sh
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell monkey -p org.pulsefour.standalone -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell input tap 960 600
            sleep 3
            adb exec-out screencap -p > release/signed-menu.png
            adb shell input tap 130 135
            sleep 2
            adb exec-out screencap -p > release/signed-songs.png
            adb shell input tap 1770 65
            sleep 2
            adb shell input tap 960 666
            sleep 5
            adb shell input tap 290 1000
            adb exec-out screencap -p > release/signed-gameplay.png
            adb shell pidof org.pulsefour.standalone
            adb logcat -d > release/signed-logcat.txt
            if grep -E 'FATAL EXCEPTION|SCRIPT ERROR|Parse Error|E godot.*ERROR:' release/signed-logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-Android-validation
          path: |
            release/signed-*.png
            release/signed-logcat.txt
            release/signature.txt
      - name: Publish standalone Android channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit=$(python -c "import json; print(json.load(open('mobile/publish-apk/release.json'))['source_commit'])")
          if ! gh release view android-standalone >/dev/null 2>&1; then
            gh release create android-standalone --target "$source_commit" --prerelease --title 'Standalone Android' --notes-file mobile/RELEASE.md
          fi
          gh release upload android-standalone release/PulseFour-Android.apk release/PulseFour-Android.pck release/android-update.json --clobber
          gh release edit android-standalone --prerelease --notes-file mobile/RELEASE.md
