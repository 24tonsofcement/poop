name: Publish Windows download
on:
  workflow_run:
    workflows: ['Build Windows release']
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-windows
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PulseFour-Windows
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish verified build assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess, zipfile, json
          root = Path('release')
          payload = next(root.rglob('PulseFour-update.zip'))
          launcher = next(root.rglob('PulseFour-Launcher.exe'))
          with zipfile.ZipFile(payload) as archive:
              version = archive.read('VERSION').decode().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid packaged version')
          tag = 'v' + version
          existing = subprocess.run(['gh','release','view',tag,'--json','isDraft'],capture_output=True,text=True)
          if existing.returncode == 0:
              if json.loads(existing.stdout)['isDraft']:
                  raise SystemExit('An incomplete draft already exists; inspect it before retrying')
              print('Version already published:', tag)
          else:
              subprocess.run(['gh','release','create',tag,'--target',os.environ['SOURCE_SHA'],
                  '--draft','--title','Pulse Four ' + version,'--notes',
                  'Download PulseFour-Launcher.exe and open it. It installs the game automatically and checks for updates on every launch. Existing songs, scores and settings are preserved.',
                  str(launcher),str(payload)],check=True)
              subprocess.run(['gh','release','edit',tag,'--draft=false','--latest'],check=True)
          PY
